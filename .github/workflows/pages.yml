name: Publish bridge interface

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    # The one record this site publishes, instances/$RECORD/. It is created at deployment; until it exists, and
    # config.js INSTANCE names it, the first check below fails and nothing is built or published.
    env:
      RECORD: sepolia-liquid-testnet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Fails closed before anything else runs: the record must exist, config.js INSTANCE must name it, and
      # bridge-core/test/live-state.js must pin its live state. The build (vite.config.ts checkRecord) and the tests below then
      # check that the record pins exactly what INSTANCE hardcodes and reaches that live state.
      - name: Check the published instance record
        run: |
          if [ -L "instances/$RECORD" ] || [ ! -f "instances/$RECORD/instance.json" ]; then
            echo "::error::instances/$RECORD/instance.json is missing"
            exit 1
          fi
          node --input-type=module -e '
            const { INSTANCE } = await import("./bridge-core/config.js");
            const { LIVE } = await import("./bridge-core/test/live-state.js");
            const record = process.env.RECORD;
            if (INSTANCE?.name !== record) {
              throw new Error("bridge-core/config.js INSTANCE names " + (INSTANCE?.name ?? "no instance")
                + ", but the site publishes instances/" + record + "/");
            }
            const live = Object.hasOwn(LIVE, record) ? LIVE[record] : undefined;
            if (!Number.isSafeInteger(live?.head) || live.head < 0 || !/^[0-9a-f]{64}$/.test(live.lc ?? "")) {
              throw new Error("bridge-core/test/live-state.js pins no live { head, lc } for instances/" + record + "/");
            }'
      # Reusable CI already ran the code and instance tests. Build the exact files this workflow will upload;
      # Vite also refuses an instance record that disagrees with bridge-core/config.js.
      - name: Build the React interface
        run: npm ci --prefix ui && npm --prefix ui run build
      # The site is the React build at its root, with the one current instance record at instances/$RECORD/, and
      # nothing else: no other record, no symlink the upload would follow out of it, no dotfile, no fixture data.
      - name: Stage the page and its instance record
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/instances"
          cp -R ui/dist/. "$site/"
          cp -R "instances/$RECORD" "$site/instances/"
          fail() { echo "::error::$1"; exit 1; }
          test -f "$site/index.html" || fail 'The build has no index.html'
          [ "$(ls -A "$site/instances")" = "$RECORD" ] || fail "The site publishes records other than instances/$RECORD/"
          [ -z "$(find "$site" -type l)" ] || fail 'The site contains a symlink'
          [ -z "$(find "$site" -name '.*')" ] || fail 'The site contains a dotfile'
          if grep -r -l -F --exclude-dir=instances 'fixture-instance' "$site"; then
            fail 'The production build contains fixture data'
          fi
      # The same light-client store gate on the staged copy, the files the artifact uploads.
      - name: Check the staged instance record
        run: RECORD_DIR="$RUNNER_TEMP/site/instances/$RECORD" node --test bridge-core/test/lc-store.test.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
