[package]
name = "sg16-bridge-program"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "SP1 guest: SP1 Helios finality update + one escrow storage slot, with sg16 bridge public values"

[[bin]]
name = "sg16-bridge-program"
path = "src/main.rs"

[dependencies]
sp1-zkvm = { workspace = true }
helios-consensus-core = { workspace = true }
sp1-helios-primitives = { workspace = true }
sg16-bridge-core = { workspace = true, features = ["guest-input"] }
serde_cbor = { workspace = true }
alloy-primitives = { workspace = true, features = ["sha3-keccak"] }
tree_hash = { workspace = true }
