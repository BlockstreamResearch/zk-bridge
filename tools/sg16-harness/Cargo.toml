[package]
name = "sg16-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs the generated simple-groth16 update leaf in a realistic Elements environment"

# A standalone workspace with its own lockfile, so the parent crate (rust-simplicity 0.8 with
# experimental jets) and this one (stock rust-simplicity 0.9, the reference generator's cost model)
# never share a dependency graph.
[workspace]

[lib]
name = "sg16_harness"
path = "src/lib.rs"

[[bin]]
name = "sg16"
path = "src/bin/sg16.rs"

[dependencies]
# Exactly the version whose cost model and encoding groth/sym.py follows (reference harness pin).
simplicity-lang = { version = "=0.9.0", features = ["human_encoding", "elements"] }
serde_json = "1"
