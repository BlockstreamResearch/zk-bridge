# sg16 bridge update guest: an SP1 Helios light-client update bound to the BridgeDeposits accumulator slot,
# with fixed-size public values for the Liquid covenant (tools/sg16/bridge-guest/liquid.py).
#
# Pinned to vendor/sp1-helios v1.3.0 (0dd8749f, fetched by tools/bootstrap-deps.py): same SP1 6.8.1, helios
# 0.12.0 and SP1 precompile patches. The tracked Cargo.lock started as a copy of vendor/sp1-helios/Cargo.lock so
# that every shared crate resolves to the same version; build with --locked and do not regenerate it.
[workspace]
members = ["core", "program", "host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
sg16-bridge-core = { path = "core" }
sp1-helios-primitives = { path = "../../../vendor/sp1-helios/primitives" }
sp1-helios-script = { path = "../../../vendor/sp1-helios/script" }
helios-consensus-core = { git = "https://github.com/a16z/helios", tag = "0.12.0" }
helios-ethereum = { git = "https://github.com/a16z/helios", tag = "0.12.0" }
sp1-zkvm = "=6.8.1"
sp1-sdk = { version = "=6.8.1" }
serde_cbor = "0.11.2"
serde_json = "1.0.125"
alloy-primitives = "1.3.0"
alloy-sol-types = "1.3.0"
tree_hash = "0.10.0"
sha2 = "0.10"
anyhow = "1.0.86"
hex = "0.4.3"
reqwest = { version = "0.12.5", features = ["json"] }
tokio = { version = "1.38.0", features = ["full"] }

# Copied verbatim from vendor/sp1-helios/Cargo.toml: SP1-accelerated hashing and BLS12-381 in the guest.
[patch.crates-io]
sha2-v0-9-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.9.9-sp1-6.0.0" }
sha2-v0-10-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
sha3-v0-11-0 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.0.0-v2" }
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
