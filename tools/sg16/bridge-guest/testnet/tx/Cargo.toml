[package]
name = "sg16-testnet-tx"
version = "0.1.0"
edition = "2021"
publish = false
description = "Liquid testnet transactions of the sg16 bridge state UTXO: tree, bootstrap, update, node-like verification"

# Its own workspace and lockfile, like tools/sg16-harness: stock simplicity-lang 0.9.0, the version whose
# encoding, jets and cost model the generated update leaf follows.  Build into the ignored bridge-guest target
# directory:
#   CARGO_TARGET_DIR=tools/sg16/bridge-guest/target/testnet-tx cargo build --release --manifest-path tools/sg16/bridge-guest/testnet/tx/Cargo.toml
[workspace]

[[bin]]
name = "sg16-testnet"
path = "src/main.rs"

[dependencies]
sg16-harness = { path = "../../../../sg16-harness" }
simplicity-lang = { version = "=0.9.0", features = ["human_encoding", "elements"] }
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
